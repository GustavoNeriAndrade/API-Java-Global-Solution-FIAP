spring.application.name=desperdicio-zero-api
server.port=${PORT:8080}

# Banco Oracle da FIAP. Usuario e senha NUNCA ficam no codigo: venham das variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Dominios do front liberados no CORS, separados por virgula (sem barra no final).
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:5173}

# Erros sempre em JSON padronizado (GlobalExceptionHandler), sem stack trace.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jackson.serialization.write-dates-as-timestamps=false
